name: Generate sitemap.xml

on:
  schedule:
    - cron: '0 20 * * *'   # tiap hari jam 03:00 WIB (UTC+7 = UTC 20:00 hari sebelumnya)
  workflow_dispatch:         # bisa juga di-trigger manual dari tab Actions di GitHub

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install @supabase/supabase-js

      - run: node generate-sitemap.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: https://www.em2studio.online

      - name: Commit sitemap.xml kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update sitemap.xml"
          git push
